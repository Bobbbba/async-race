<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Race</title>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>🏁 Async Race</h1>
            
            <!-- Winner Modal -->
            <div id="winnerModalContainer"></div>

            <!-- Controls -->
            <div id="controlsContainer"></div>

            <!-- Race Info -->
            <div class="race-controls">
                <span class="page-info" id="pageInfo">Страница 1 / 1</span>
                <span class="total-cars" id="totalCarsInfo">Всего: 0</span>
            </div>

            <!-- Garage -->
            <div class="garage-header">
                <h2>🚗 Гараж</h2>
                <span id="garageCount">0 автомобилей</span>
            </div>

            <div class="race-track" id="raceTrack">
                <div class="empty-message">Загрузка...</div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
